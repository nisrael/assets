version = 1

# ── Diday event graphics ──────────────────────────────────────────────────────
# diday/events/: compositions by Nils Israel (CC0-1.0),
# incorporating:
#   - DIDAY logo from https://codeberg.org/DI-Day/website (CC-BY-4.0, Stella Schiffczyk)
#   - Pixeled background extracted from https://codeberg.org/DI-Day/creative-identity
#     document/guide/styleguide.pdf (CC-BY-4.0, MultisampledNight)
# Flyers that include the Chaostreff Osnabrück e.V. logo also carry that
# logo's copyright; see chaostreff/logo/ annotations and
# LICENSES/LicenseRef-Chaostreff-pending.txt.

[[annotations]]
path = "diday/events/**"
SPDX-FileCopyrightText = [
    "2026 Nils Israel",
    "2026 Stella Schiffczyk",
    "2025 MultisampledNight",
]
SPDX-License-Identifier = "CC0-1.0 AND CC-BY-4.0"

[[annotations]]
path = "diday/event-banner/**"
SPDX-FileCopyrightText = "2026 Benjamin Zöllner"
SPDX-License-Identifier = "LicenseRef-DIDAY-Zoellner-pending"

# ── Chaostreff Osnabrück e.V. logo and graphics ───────────────────────────────
# License not yet assigned.

[[annotations]]
path = "chaostreff/logo/**"
SPDX-FileCopyrightText = "Chaostreff Osnabrück e.V."
SPDX-License-Identifier = "LicenseRef-Chaostreff-pending"

[[annotations]]
path = ["chaostreff/**", "chaostalks/**", "rabbithole/**", "osna.social/**", "README.md"]
SPDX-FileCopyrightText = "Chaostreff Osnabrück e.V."
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

[[annotations]]
path = "rabbithole/inside/long-exposure.jpg"
SPDX-FileCopyrightText = "Tim Klausmeyer"
SPDX-License-Identifier = "CC-BY-NC-4.0"
# Overrides the rabbithole/** blanket rule above: this specific photo is
# externally licensed, not Chaostreff Osnabrück e.V. all-rights-reserved.
# The crops used in diday/talk-diday-www/ carry the same annotation.

# ── DIDAY-Vortrag "Wieso, weshalb, warum?" (Digitale Woche Osnabrück 2026) ─────
# diday/talk-diday-www/: fonts and the Chaostreff logo are symlinked into
# fonts/ and chaostreff/logo/ and inherit those annotations. Everything below
# is either Nils Israel's own talk content or third-party assets bundled with
# it; see README.md for the human-readable summary and slides.md for in-slide
# photo credits. slides.md also quotes third-party sources directly; those
# quotations are individually referenced in-slide, not separately annotated
# here.

[[annotations]]
path = [
    "diday/talk-diday-www/.gitignore",
    "diday/talk-diday-www/package.json",
    "diday/talk-diday-www/pnpm-lock.yaml",
    "diday/talk-diday-www/slides.md",
    "diday/talk-diday-www/theme.css",
    "diday/talk-diday-www/assets/media/qr-code-diday-www.svg",
]
